<!DOCTYPE html>
<html>
<head>
    <title>SCOREBOARD LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="pg-login">
    <div class="box">
        <h1>SCOREBOARD</h1>
        <div class="sub">SYSTEM ACCESS</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">ENTER</button>
        </form>
    </div>
    <script>
        fetch('/api/settings').then(r => r.json()).then(s => {
            if (s.theme === 'light') document.body.classList.add('light');
        }).catch(() => {});
    </script>
</body>
</html>
